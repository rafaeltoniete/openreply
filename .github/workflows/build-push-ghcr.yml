# Builda a imagem do openreply e publica no ghcr.io (ghcr.io/rafaeltoniete/openreply).
# Uma imagem só serve aos três processos (web, worker, cron) — quem decide o papel
# é o `command` de cada serviço no docker-stack.yml.
#
# Publicar uma versão:
#   git tag v1 && git push origin v1
# Ou Actions → build-push-ghcr → Run workflow (informando a versão).
#
# ⚠️ ARQUITETURA: builda **linux/arm64**, porque a VPS do ecossistema é arm64.
# Confirme com `uname -m` na VPS antes da primeira tag:
#   aarch64 → é isto aqui, não mexa.
#   x86_64  → troque as DUAS linhas marcadas com [ARCH] abaixo para
#             `runs-on: ubuntu-latest` e `platforms: linux/amd64`.
# Não builde arm64 por QEMU num runner amd64: `next build` sob emulação trava.
name: build-push-ghcr

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da imagem (ex.: v1)"
        required: true
        default: "v1"

env:
  REGISTRY: ghcr.io
  IMAGE: openreply

jobs:
  build:
    runs-on: ubuntu-24.04-arm # [ARCH] runner arm64 nativo
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versão
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64 # [ARCH]
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
